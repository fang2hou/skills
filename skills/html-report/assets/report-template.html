<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <style>
      :root {
        --lightningcss-light: initial;
        --lightningcss-dark: ;
        color-scheme: light;
        --bg: #faf6ef;
        --surface: #fffdf8;
        --sunk: #f3eee4;
        --ink: #28303b;
        --ink-2: #4a5462;
        --muted: #646c78;
        --line: #e4dccf;
        --line-2: #d3c9b8;
        --accent: #3a5470;
        --accent-soft: #e7ecf2;
        --ok: #3d6a4c;
        --ok-soft: #e9f0e8;
        --warn: #85571a;
        --warn-soft: #f6ecda;
        --risk: #99392f;
        --risk-soft: #f6e5e1;
        --r-lg: 14px;
        --r-sm: 8px;
      }
      :root,
      :lang(en) {
        --mono:
          "JetBrainsMono Nerd Font", "JetBrains Mono", "IBM Plex Mono", ui-monospace, Menlo,
          monospace;
        --ui:
          "IBM Plex Sans", "IBM Plex Sans JP", -apple-system, "Helvetica Neue", system-ui,
          sans-serif;
        --body: Charter, "Iowan Old Style", Georgia, serif;
        --fs: 18px;
        --lh: 1.65;
        --ls: 0;
        --measure: 68ch;
      }
      :lang(zh) {
        --ui:
          "IBM Plex Sans SC", "Source Han Sans SC VF", "Source Han Sans SC", "PingFang SC",
          sans-serif;
        --body:
          "FZPingXianYaSong-R-GBK", "LXGW Neo ZhiSong Screen Full", "LXGW Neo ZhiSong Screen",
          "Source Han Serif SC", "Songti SC", serif;
        --fs: 17.5px;
        --lh: 1.85;
        --ls: 0.02em;
        --measure: 38em;
      }
      :lang(ja) {
        --ui:
          "IBM Plex Sans JP", "Source Han Sans VF", "Hiragino Sans", "Hiragino Kaku Gothic ProN",
          sans-serif;
        --body: "Hiragino Mincho ProN", "Yu Mincho", "Source Han Serif JP", serif;
        --fs: 17.5px;
        --lh: 1.9;
        --ls: 0.04em;
        --measure: 38em;
      }
      *,
      :before,
      :after {
        box-sizing: border-box;
      }
      html {
        background: var(--bg);
        color: var(--ink);
        font-size: var(--fs);
        -webkit-text-size-adjust: 100%;
      }
      html:has(.submit-dock) {
        scroll-padding-bottom: 130px;
      }
      body {
        font-family: var(--body);
        line-height: var(--lh);
        letter-spacing: var(--ls);
        text-autospace: normal;
        text-wrap: pretty;
        font-kerning: normal;
        margin: 0;
      }
      [lang]:not(:root) {
        font-family: var(--body);
        letter-spacing: var(--ls);
      }
      :is(h1, h2, h3, h4, legend, summary, table, label, .ui, .chip, .kicker, .meta, .hint) [lang],
      .ui[lang] {
        font-family: var(--ui);
      }
      :lang(ja) {
        line-break: strict;
      }
      .page {
        grid-template-columns: 1fr min(var(--measure), 100%) 1fr;
        padding: 56px 28px 120px;
        display: grid;
      }
      .page > * {
        grid-column: 2;
        min-width: 0;
      }
      .page > .wide {
        grid-column: 1/-1;
        justify-self: center;
        width: min(1080px, 100%);
      }
      h1,
      h2,
      h3,
      h4,
      legend,
      summary,
      table,
      button,
      input,
      textarea,
      select,
      .ui {
        font-family: var(--ui);
      }
      h1,
      h2,
      h3,
      h4 {
        color: var(--ink);
        text-wrap: balance;
        line-height: 1.35;
      }
      :lang(ja) :is(h1, h2, h3, h4) {
        word-break: auto-phrase;
      }
      h1 {
        margin: 0 0 0.35em;
        font-size: 2em;
        font-weight: 600;
      }
      h2 {
        border-top: 1px solid var(--line);
        margin: 2.4em 0 0.7em;
        padding-top: 1.1em;
        font-size: 1.42em;
        font-weight: 600;
      }
      h3 {
        margin: 1.8em 0 0.5em;
        font-size: 1.14em;
        font-weight: 600;
      }
      h4 {
        margin: 1.4em 0 0.4em;
        font-size: 1em;
        font-weight: 600;
      }
      p,
      ul,
      ol {
        margin: 0.75em 0;
      }
      li + li {
        margin-top: 0.35em;
      }
      ul,
      ol {
        padding-left: 1.4em;
      }
      strong {
        font-weight: 600;
      }
      :is(:lang(zh), :lang(ja)) :is(p, li, td, dd) > strong {
        font-family: var(--ui);
      }
      a {
        color: var(--accent);
        text-underline-offset: 0.2em;
        text-decoration-thickness: 1px;
      }
      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      hr {
        border: 0;
        border-top: 1px solid var(--line);
        margin: 2em 0;
      }
      .masthead {
        margin-bottom: 2em;
      }
      .kicker,
      .meta {
        font-family: var(--ui);
        color: var(--muted);
        margin: 0;
        font-size: 0.86em;
      }
      .kicker {
        margin-bottom: 0.6em;
      }
      .summary {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--r-lg);
        margin: 0 0 1.6em;
        padding: 22px 26px;
      }
      @supports (corner-shape: squircle) {
        .summary {
          corner-shape: squircle;
          border-radius: 20px;
        }
      }
      .summary > h2 {
        color: var(--muted);
        border: 0;
        margin: 0 0 0.4em;
        padding: 0;
        font-size: 0.86em;
      }
      .summary > :last-child {
        margin-bottom: 0;
      }
      .chip {
        font-family: var(--ui);
        letter-spacing: 0;
        background: var(--sunk);
        color: var(--ink-2);
        white-space: nowrap;
        vertical-align: 0.08em;
        border-radius: 999px;
        padding: 0 0.6em;
        font-size: max(0.82em, 14px);
        line-height: 1.6;
        display: inline-block;
      }
      .chip.ok {
        background: var(--ok-soft);
        color: var(--ok);
      }
      .chip.warn {
        background: var(--warn-soft);
        color: var(--warn);
      }
      .chip.risk {
        background: var(--risk-soft);
        color: var(--risk);
      }
      .chip.accent {
        background: var(--accent-soft);
        color: var(--accent);
      }
      code {
        font-family: var(--mono);
        letter-spacing: 0;
        background: var(--sunk);
        border-radius: 4px;
        padding: 0.1em 0.35em;
        font-size: 0.86em;
      }
      pre {
        font-family: var(--mono);
        letter-spacing: 0;
        background: var(--sunk);
        border-radius: 10px;
        padding: 14px 18px;
        font-size: 0.86em;
        line-height: 1.6;
        overflow-x: auto;
      }
      pre code {
        background: 0 0;
        padding: 0;
        font-size: 1em;
      }
      td > time {
        white-space: nowrap;
      }
      [id] {
        scroll-margin-top: 24px;
      }
      .toc {
        font-family: var(--ui);
        columns: 2 16em;
        column-gap: 2em;
        padding-left: 1.2em;
        font-size: 0.92em;
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
        }
      }
      .conn-chip {
        z-index: 4;
        border: 1px solid var(--line);
        background: var(--surface);
        color: var(--muted);
        font-family: var(--ui);
        letter-spacing: 0;
        cursor: pointer;
        text-align: left;
        border-radius: 999px;
        align-items: center;
        gap: 8px;
        padding: 5px 12px 5px 10px;
        font-size: max(0.72em, 14px);
        display: none;
        position: fixed;
        top: 16px;
        left: 16px;
      }
      .conn-chip.show {
        display: inline-flex;
      }
      .conn-chip i {
        background: color-mix(in srgb, var(--muted) 55%, var(--bg));
        border-radius: 50%;
        width: 8px;
        height: 8px;
      }
      .conn-chip.on {
        color: var(--ok);
        border-color: color-mix(in srgb, var(--ok) 32%, var(--line));
      }
      .conn-chip.on i {
        background: var(--ok);
        animation: 2.4s ease-in-out infinite conn-pulse;
      }
      @keyframes conn-pulse {
        50% {
          opacity: 0.35;
        }
      }
      .conn-chip b {
        background: var(--accent-soft);
        min-width: 18px;
        color: var(--ink);
        text-align: center;
        border-radius: 999px;
        padding: 1px 6px;
        font-weight: 600;
      }
      .qa-list {
        z-index: 5;
        background: var(--surface);
        border: 1px solid var(--line-2);
        border-radius: var(--r-sm);
        width: min(400px, 100vw - 32px);
        max-height: min(70vh, 560px);
        font-family: var(--ui);
        flex-direction: column;
        display: none;
        position: fixed;
        top: 54px;
        left: 16px;
        overflow: hidden;
        box-shadow: 0 10px 32px #28303b29;
      }
      .qa-list.show {
        display: flex;
      }
      .qa-list .qa-body {
        padding: 4px 10px 10px;
        overflow: hidden auto;
      }
      .qa-list .qa-row {
        border-radius: var(--r-sm);
        text-align: left;
        cursor: pointer;
        width: 100%;
        font: inherit;
        color: inherit;
        background: 0 0;
        border: 1px solid #0000;
        margin: 6px 0;
        padding: 8px 10px;
      }
      .qa-list .qa-row:hover {
        background: var(--sunk);
      }
      .qa-list .qa-row .t {
        text-overflow: ellipsis;
        -webkit-line-clamp: 2;
        line-clamp: 2;
        color: var(--ink);
        -webkit-box-orient: vertical;
        display: -webkit-box;
        overflow: hidden;
      }
      .qa-list .qa-row .s {
        color: var(--muted);
        margin-top: 2px;
        font-size: max(0.78em, 14px);
        display: block;
      }
      .qa-list .qa-row.pending .s {
        color: var(--warn);
      }
      .qa-list .qa-empty {
        color: var(--muted);
        padding: 10px;
      }
      .qa-list .qa-thread {
        padding: 2px 10px 8px;
      }
      .qa-bubble {
        z-index: 6;
        background: var(--surface);
        border: 1px solid var(--line-2);
        border-radius: var(--r-sm);
        font-family: var(--ui);
        align-items: center;
        gap: 6px;
        padding: 7px 10px 7px 12px;
        display: none;
        position: absolute;
        box-shadow: 0 6px 24px #28303b24;
      }
      .qa-bubble.show {
        display: flex;
      }
      .qa-bubble input {
        width: 250px;
        color: var(--ink);
        font: inherit;
        background: 0 0;
        border: 0;
        font-size: max(0.78em, 14px);
      }
      .qa-bubble input:focus {
        outline: none;
      }
      .qa-bubble .hint {
        color: var(--muted);
        white-space: nowrap;
        font-size: max(0.7em, 14px);
      }
      .qa-send {
        border: 1px solid var(--accent);
        border-radius: var(--r-sm);
        background: var(--accent);
        color: #fff;
        font-family: var(--ui);
        cursor: pointer;
        padding: 4px 10px;
        font-size: max(0.72em, 14px);
      }
      .qa-send:disabled {
        opacity: 0.5;
        cursor: default;
      }
      .qa-mark {
        cursor: help;
        -webkit-text-decoration: underline dotted color-mix(in srgb, var(--muted) 70%, transparent);
        text-decoration: underline dotted color-mix(in srgb, var(--muted) 70%, transparent);
        -webkit-text-decoration-skip-ink: none;
        text-decoration-skip-ink: none;
        text-underline-offset: 3px;
      }
      .qa-mark.answered {
        -webkit-text-decoration: underline solid var(--accent);
        text-decoration: underline solid var(--accent);
      }
      .qa-pop {
        z-index: 6;
        background: var(--surface);
        border: 1px solid var(--line-2);
        border-radius: var(--r-sm);
        width: min(380px, 100vw - 48px);
        font-family: var(--ui);
        padding: 14px 16px 12px;
        font-size: max(0.78em, 14px);
        line-height: 1.5;
        position: absolute;
        box-shadow: 0 10px 32px #28303b29;
      }
      .qa-head {
        color: var(--muted);
        justify-content: space-between;
        align-items: center;
        margin-bottom: 6px;
        display: flex;
      }
      .qa-close {
        color: var(--muted);
        cursor: pointer;
        background: 0 0;
        border: 0;
        padding: 0 2px;
        font-size: 1.1em;
      }
      .qa-close:hover {
        color: var(--ink);
      }
      .qa-item {
        border-radius: var(--r-sm);
        margin: 6px 0;
        padding: 6px 10px;
      }
      .qa-item.user {
        background: var(--sunk);
      }
      .qa-item.agent {
        background: var(--accent-soft);
      }
      .qa-item .who {
        color: var(--muted);
        margin-bottom: 2px;
        font-size: max(0.8em, 14px);
        display: block;
      }
      .qa-quote {
        color: var(--muted);
        margin-bottom: 2px;
        font-style: italic;
      }
      .qa-item.pending {
        color: var(--muted);
      }
      .qa-follow {
        gap: 6px;
        margin-top: 10px;
        display: flex;
      }
      .qa-follow input {
        border: 1px solid var(--line-2);
        border-radius: var(--r-sm);
        background: var(--surface);
        min-width: 0;
        color: var(--ink);
        font: inherit;
        flex: 1;
        padding: 6px 10px;
      }
      .qa-follow input:focus {
        border-color: var(--accent);
        outline: none;
      }
      @media (prefers-reduced-motion: reduce) {
        .conn-chip i {
          animation: none;
        }
      }
      @media print {
        html {
          background: #fff;
          font-size: 11pt;
        }
        .page {
          padding: 0;
        }
        .submit-dock,
        .btn,
        .conn-chip,
        .qa-list,
        .qa-bubble,
        .qa-pop {
          display: none !important;
        }
        h2,
        h3 {
          break-after: avoid;
        }
        .card,
        .summary,
        figure,
        tr {
          break-inside: avoid;
        }
      }
      .card.svelte-mvy2et {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--r-lg);
        margin: 1.2em 0;
        padding: 20px 24px;
      }
      @supports (corner-shape: squircle) {
        .card.svelte-mvy2et {
          corner-shape: squircle;
          border-radius: 20px;
        }
      }
      .callout.svelte-mvy2et {
        border-left: 3px solid var(--accent);
        background: var(--accent-soft);
        border-radius: 0 10px 10px 0;
        margin: 1.2em 0;
        padding: 12px 18px;
      }
      .callout.svelte-mvy2et > :where(.svelte-mvy2et):first-child {
        margin-top: 0;
      }
      .callout.svelte-mvy2et > :where(.svelte-mvy2et):last-child {
        margin-bottom: 0;
      }
      .callout.ok.svelte-mvy2et {
        border-color: var(--ok);
        background: var(--ok-soft);
      }
      .callout.warn.svelte-mvy2et {
        border-color: var(--warn);
        background: var(--warn-soft);
      }
      .callout.risk.svelte-mvy2et {
        border-color: var(--risk);
        background: var(--risk-soft);
      }
      .figures.svelte-mvy2et {
        font-family: var(--ui);
        grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
        gap: 14px 20px;
        margin: 1.4em 0;
        display: grid;
      }
      .figures.svelte-mvy2et > div:where(.svelte-mvy2et) {
        border-top: 2px solid var(--line-2);
        padding-top: 8px;
      }
      .figures.svelte-mvy2et b:where(.svelte-mvy2et) {
        font-variant-numeric: tabular-nums;
        font-size: 1.75em;
        font-weight: 600;
        line-height: 1.2;
        display: block;
      }
      .figures.svelte-mvy2et span:where(.svelte-mvy2et) {
        color: var(--muted);
        font-size: 0.86em;
      }
      dl.kv.svelte-mvy2et {
        grid-template-columns: max-content minmax(0, 1fr);
        gap: 6px 20px;
        margin: 1em 0;
        display: grid;
      }
      dl.kv.svelte-mvy2et > dt:where(.svelte-mvy2et) {
        font-family: var(--ui);
        color: var(--muted);
        padding-top: 0.08em;
        font-size: 0.92em;
      }
      dl.kv.svelte-mvy2et > dd:where(.svelte-mvy2et) {
        margin: 0;
      }
      .table-wrap.svelte-mvy2et {
        margin: 1.2em 0;
        overflow-x: auto;
      }
      table.svelte-mvy2et {
        border-collapse: collapse;
        letter-spacing: 0;
        width: 100%;
        font-size: 0.9em;
        line-height: 1.55;
      }
      th.svelte-mvy2et,
      td.svelte-mvy2et {
        text-align: left;
        vertical-align: top;
        border-bottom: 1px solid var(--line);
        padding: 9px 12px;
      }
      th.svelte-mvy2et {
        color: var(--ink-2);
        border-bottom-color: var(--line-2);
        white-space: nowrap;
        font-weight: 600;
      }
      td.num.svelte-mvy2et,
      th.num.svelte-mvy2et {
        text-align: right;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      .bars.svelte-mvy2et {
        font-family: var(--ui);
        grid-template-columns: minmax(6em, max-content) 1fr auto;
        align-items: center;
        gap: 8px 14px;
        margin: 1.2em 0;
        font-size: 0.9em;
        display: grid;
      }
      .bars.svelte-mvy2et > .track:where(.svelte-mvy2et) {
        background: var(--sunk);
        border-radius: 5px;
        height: 10px;
        overflow: hidden;
      }
      .bars.svelte-mvy2et > .track:where(.svelte-mvy2et) > i:where(.svelte-mvy2et) {
        height: 100%;
        width: var(--v);
        background: var(--accent);
        display: block;
      }
      .bars.svelte-mvy2et > .v:where(.svelte-mvy2et) {
        font-variant-numeric: tabular-nums;
        text-align: right;
      }
      .compare.svelte-mvy2et {
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: 16px;
        margin: 1.4em 0;
        display: grid;
      }
      .compare.wide.svelte-mvy2et {
        grid-column: 1/-1;
        justify-self: center;
        width: min(1080px, 100%);
      }
      .compare.svelte-mvy2et > article:where(.svelte-mvy2et) {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--r-lg);
        padding: 18px 22px;
        position: relative;
      }
      .badge.svelte-mvy2et {
        font-family: var(--ui);
        letter-spacing: 0;
        background: var(--accent);
        color: #fff;
        white-space: nowrap;
        border-radius: 999px;
        padding: 4px 12px;
        font-size: 0.78em;
        line-height: 1;
        position: absolute;
        top: 0;
        left: 50%;
        transform: translate(-50%, -50%);
      }
      @supports (corner-shape: squircle) {
        .compare.svelte-mvy2et > article:where(.svelte-mvy2et) {
          corner-shape: squircle;
          border-radius: 20px;
        }
      }
      .compare.svelte-mvy2et > article.pick:where(.svelte-mvy2et) {
        border-color: var(--accent);
        box-shadow: inset 0 0 0 1px var(--accent);
      }
      .compare.svelte-mvy2et h3:where(.svelte-mvy2et) {
        margin-top: 0;
      }
      .pros.svelte-mvy2et,
      .cons.svelte-mvy2et {
        margin: 0.4em 0;
        padding-left: 0;
        list-style: none;
      }
      .pros.svelte-mvy2et > li:where(.svelte-mvy2et):before,

        font-family: var(--ui);
        width: 1.2em;
        font-weight: 600;
        display: inline-block;
      }
      .pros.svelte-mvy2et > li:where(.svelte-mvy2et):before {
        content: "+";
        color: var(--ok);
      }
      .cons.svelte-mvy2et > li:where(.svelte-mvy2et):before {
        content: "−";
        color: var(--risk);
      }
      .steps.svelte-mvy2et {
        counter-reset: step;
        padding-left: 0;
        list-style: none;
      }
      .steps.svelte-mvy2et > li:where(.svelte-mvy2et) {
        counter-increment: step;
        padding-left: 2.4em;
        position: relative;
      }
      .steps.svelte-mvy2et > li:where(.svelte-mvy2et):before {
        content: counter(step);
        background: var(--accent-soft);
        width: 1.6em;
        height: 1.6em;
        color: var(--accent);
        font:
          600 0.85em/1.6em var(--ui),

        text-align: center;
        border-radius: 50%;
        position: absolute;
        top: 0.15em;
        left: 0;
      }
      .pair.svelte-mvy2et {
        margin: 1em 0;
      }
      .pair.svelte-mvy2et > .tr:where(.svelte-mvy2et) {
        margin: 0;
