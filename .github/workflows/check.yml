name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Install toolchain (mise)
        uses: jdx/mise-action@v4
      - name: Run validation checks
        run: mise run check

  validate-commit-history:
    name: Validate commit history
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install toolchain (mise)
        uses: jdx/mise-action@v4
      - name: Validate commit history
        run: cog check
